[project]
name = "py-xiaozhi"
version = "1.0.0"
description = "Xiaozhi AI Client - Cross-platform voice assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Junsen", email = "junsen@example.com" }]
keywords = ["ai", "voice-assistant", "xiaozhi"]

dependencies = [
# Audio processing
"numpy>=1.26.0",
"sounddevice>=0.4.4",
"soxr>=0.5.0",
"opuslib>=3.0.1",
# Network communication
"aiohttp>=3.9.0",
"websockets>=11.0.3",
"paho-mqtt>=2.1.0",
"requests>=2.31.0",
# AI/ML
"openai>=1.0.0",
"sherpa-onnx>=1.12.26",
"sherpa-onnx-core>=1.12.26; sys_platform != 'win32'",
# Image processing
"opencv-python-headless>=4.9.0",
"pillow>=10.0.0",
# Encryption
"cryptography>=42.0.0",
# Utility libraries
"psutil>=5.9.0",
"pendulum>=3.0.0",
"py-machineid>=0.6.0",
"platformdirs>=4.0.0",
# Music/Media
"mutagen>=1.47.0",
# Chinese language processing
"pypinyin>=0.51.0",
"lunar_python>=1.3.0",
# Clipboard
"pyperclip>=1.8.0",
# Hotkeys (cross-platform foundation)
"pynput>=1.7.6",
# ============================================================
# Platform-specific dependencies (Automatically installed based on the system)
# ============================================================
# macOS dependencies
"applescript>=2021.2.9; sys_platform == 'darwin'",
"pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
"pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
# Windows dependencies
"comtypes>=1.4.0; sys_platform == 'win32'",
"pycaw>=20230407; sys_platform == 'win32'",
"pywin32>=306; sys_platform == 'win32'",
# Linux dependencies (GPIO mode)
"gpiozero>=2.0.1; sys_platform == 'linux'",
"lgpio>=0.2.2.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Additional dependencies for GUI mode
# Enable using `uv sync --extra gui` or `pip install '.[gui]'`
gui = [
"PySide6>=6.6.0",
"qasync>=0.27.1",
]

# macOS-specific dependencies (automatically installed via environment markers; retained for explicit installation)
macos = [
"applescript>=2021.2.9",
"pyobjc-framework-Quartz>=10.0",
"pyobjc-framework-Cocoa>=10.0",
]

# Windows-specific dependencies (automatically installed via environment markers; retained for explicit installation)
windows = [
"comtypes>=1.4.0",
"pycaw>=20230407",
"pywin32>=306",
]

# Linux-specific dependencies (GPIO mode)
linux = [
"gpiozero>=2.0.1",
"lgpio>=0.2.2.0",
]
# TUI full-screen terminal mode: uv sync --extra tui
tui = [ "textual>=0.80.0",
]

# Note: Do not install picamera2 via pip extras for Raspberry Pi CSI support.
# picamera2 depends on python-prctl (Linux only); uv sync/run will fail to compile on macOS.
# On Pi Bookworm, use the system package: sudo apt install python3-picamera2
# The code automatically enables the CSI backend (CAMERA.backend=auto/picamera2) upon importing picamera2. [project.scripts]
xiaozhi = "main:main"

[project.urls]
Homepage = "https://github.com/huangjunsen0406/py-xiaozhi"
Repository = "https://github.com/huangjunsen0406/py-xiaozhi"

# ============================================================
# Dependency groups (compatible with uv/pip)
# ============================================================
[dependency-groups]
dev = [
"pyinstaller>=6.0.0",
"ruff>=0.4.0",
"pytest>=8.0.0",
"pytest-asyncio>=0.23.0",
]

# ============================================================
# Ruff configuration (replaces black + isort + flake8)
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
"E",   # pycodestyle errors
"W",   # pycodestyle warnings
"F",   # Pyflakes
"I",   # isort
"B",   # flake8-bugbear
"C4",  # flake8-comprehensions
"UP",  # pyupgrade
]
ignore = [
"E501",  # line too long (handled by formatter)
"B008",  # function call in default argument
"C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================
# pytest configuration
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

# ============================================================
# Retain legacy tool configurations (backward compatibility)
# ============================================================
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/( 
\.eggs 
| \.git 
| \.hg 
| \.mypy_cache 
| \.tox 
| \.venv 
| build 
| dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ============================================================
# Build system
# ============================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
